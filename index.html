<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>영어 단어 객관식 퀴즈</title>

  <!-- Supabase JavaScript v2 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f3f5f9;
      color: #202938;
      font-family: Arial, "Malgun Gothic", sans-serif;
    }

    .app {
      width: 100%;
      max-width: 520px;
      padding: 30px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 35px rgba(20, 35, 60, 0.08);
    }

    .eyebrow {
      color: #5269d9;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.5px;
    }

    h1 {
      margin: 10px 0 8px;
      font-size: 27px;
    }

    .description {
      margin: 0;
      color: #697386;
      line-height: 1.6;
      font-size: 14px;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      margin-top: 26px;
      margin-bottom: 10px;
      color: #697386;
      font-size: 13px;
    }

    .progress-track {
      height: 7px;
      overflow: hidden;
      border-radius: 10px;
      background: #e8ebf3;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      border-radius: 10px;
      background: #5269d9;
      transition: width 0.25s ease;
    }

    .question-card {
      margin-top: 24px;
      padding: 25px 20px;
      border: 1px solid #e9ecf3;
      border-radius: 16px;
      text-align: center;
    }

    .word-label {
      color: #7a8495;
      font-size: 13px;
    }

    .word {
      margin: 12px 0 8px;
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -1px;
      overflow-wrap: anywhere;
    }

    .instruction {
      color: #697386;
      font-size: 14px;
    }

    .options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 22px;
    }

    .option {
      min-height: 58px;
      padding: 12px;
      border: 1px solid #dfe4ed;
      border-radius: 12px;
      background: white;
      color: #273247;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      overflow-wrap: anywhere;
    }

    .option:hover:not(:disabled) {
      border-color: #5269d9;
      background: #f5f6ff;
    }

    .option:focus-visible,
    .primary-button:focus-visible {
      outline: 3px solid #a9b4ff;
      outline-offset: 3px;
    }

    .option:disabled {
      cursor: default;
      opacity: 1;
    }

    .option.correct {
      border-color: #15966b;
      background: #e9f8f1;
      color: #08734e;
      font-weight: 700;
    }

    .option.wrong {
      border-color: #df5965;
      background: #fff0f1;
      color: #b52e3b;
      font-weight: 700;
    }

    .feedback {
      display: none;
      margin-top: 18px;
      padding: 14px;
      border-radius: 12px;
      line-height: 1.6;
      font-size: 14px;
      text-align: left;
    }

    .feedback.show {
      display: block;
    }

    .feedback.correct {
      background: #e9f8f1;
      color: #08734e;
    }

    .feedback.wrong {
      background: #fff0f1;
      color: #b52e3b;
    }

    .save-status {
      margin-top: 12px;
      color: #697386;
      font-size: 12px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .primary-button {
      width: 100%;
      min-height: 48px;
      margin-top: 20px;
      padding: 12px 16px;
      border: none;
      border-radius: 12px;
      background: #5269d9;
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .primary-button:hover {
      background: #4056c3;
    }

    .primary-button:disabled {
      background: #aeb8e8;
      cursor: default;
    }

    .result {
      display: none;
      margin-top: 24px;
      padding: 26px 20px;
      border-radius: 16px;
      background: #f5f6ff;
      text-align: center;
    }

    .result.show {
      display: block;
    }

    .result-label {
      color: #697386;
      font-size: 14px;
    }

    .score {
      margin: 12px 0;
      color: #4056c3;
      font-size: 48px;
      font-weight: 800;
    }

    .result-message {
      color: #4d586c;
      line-height: 1.6;
      font-size: 14px;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 420px) {
      .app {
        padding: 22px 16px;
      }

      .word {
        font-size: 31px;
      }

      .options {
        gap: 9px;
      }

      .option {
        padding: 10px 6px;
        font-size: 14px;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <div class="eyebrow">ENGLISH VOCABULARY</div>
    <h1>영어 단어 퀴즈</h1>
    <p class="description">
      영어 단어의 뜻을 골라 보세요.<br>
      총 3문제이며 각 문제는 한 번만 답할 수 있습니다.
    </p>

    <section id="quiz-section">
      <div class="progress-info">
        <span id="question-counter">문제 1 / 3</span>
        <span id="score-counter">현재 점수 0점</span>
      </div>

      <div
        class="progress-track"
        role="progressbar"
        aria-label="퀴즈 진행률"
        aria-valuemin="0"
        aria-valuemax="3"
        aria-valuenow="0"
        id="progress-track"
      >
        <div class="progress-bar" id="progress-bar"></div>
      </div>

      <div class="question-card">
        <div class="word-label">다음 단어의 뜻은 무엇일까요?</div>
        <div class="word" id="word">abundant</div>
        <div class="instruction">가장 알맞은 뜻 하나를 선택하세요.</div>

        <div class="options" id="options">
          <button class="option" type="button" data-index="0">조용한</button>
          <button class="option" type="button" data-index="1">풍부한</button>
          <button class="option" type="button" data-index="2">위험한</button>
          <button class="option" type="button" data-index="3">느린</button>
        </div>

        <div
          id="feedback"
          class="feedback"
          role="status"
          aria-live="polite"
        ></div>

        <div
          id="save-status"
          class="save-status"
          role="status"
          aria-live="polite"
        ></div>
      </div>

      <button
        id="next-button"
        class="primary-button hidden"
        type="button"
      >
        다음 문제
      </button>
    </section>

    <section id="result-section" class="result" aria-live="polite">
      <div class="result-label">QUIZ COMPLETE</div>
      <h2>퀴즈 완료!</h2>
      <div class="score" id="final-score">0 / 3</div>
      <div class="result-message" id="result-message"></div>
      <button id="retry-button" class="primary-button" type="button">
        다시 풀기
      </button>
    </section>
  </main>

  <script>
    // ==========================================
    // 1. Supabase 설정: 아래 두 값만 교체하세요.
    // ==========================================
    const SUPABASE_URL = "YOUR_SUPABASE_URL";
    const SUPABASE_PUBLISHABLE_KEY = "YOUR_PUBLISHABLE_KEY";

    // ==========================================
    // 2. Supabase 클라이언트
    // ==========================================
    const configIsReady =
      SUPABASE_URL !== "https://aajlvylxcbyijlnqesaj.supabase.co" &&
      SUPABASE_PUBLISHABLE_KEY !== "sb_publishable_oE2LM6eA_kxKpKAGf0rP7g_Q-c1BJc1" &&
      SUPABASE_URL.startsWith("https://") &&
      SUPABASE_PUBLISHABLE_KEY.length > 0;

    const supabaseClient = configIsReady
      ? window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_PUBLISHABLE_KEY
        )
      : null;

    // ==========================================
    // 3. 퀴즈 문제
    // 정답은 화면 표시용 한국어 보기와 일치합니다.
    // ==========================================
    const questions = [
      {
        question_no: 1,
        english_word: "abundant",
        options: ["조용한", "풍부한", "위험한", "느린"],
        correct_answer: "풍부한"
      },
      {
        question_no: 2,
        english_word: "reluctant",
        options: ["주저하는", "열정적인", "정확한", "부지런한"],
        correct_answer: "주저하는"
      },
      {
        question_no: 3,
        english_word: "brief",
        options: ["강력한", "평범한", "짧은", "불규칙한"],
        correct_answer: "짧은"
      }
    ];

    // ==========================================
    // 4. 상태 관리
    // ==========================================
    let currentIndex = 0;
    let score = 0;
    let attemptId = "";
    let questionStartedAt = 0;
    let hasAnswered = false;

    // 문제별 저장 상태: pending / success / error / not_configured
    let saveStates = [];

    const quizSection = document.getElementById("quiz-section");
    const resultSection = document.getElementById("result-section");
    const questionCounter = document.getElementById("question-counter");
    const scoreCounter = document.getElementById("score-counter");
    const progressTrack = document.getElementById("progress-track");
    const progressBar = document.getElementById("progress-bar");
    const wordElement = document.getElementById("word");
    const optionsElement = document.getElementById("options");
    const feedbackElement = document.getElementById("feedback");
    const saveStatusElement = document.getElementById("save-status");
    const nextButton = document.getElementById("next-button");
    const finalScoreElement = document.getElementById("final-score");
    const resultMessageElement = document.getElementById("result-message");
    const retryButton = document.getElementById("retry-button");

    // ==========================================
    // 5. 새 퀴즈 시작
    // ==========================================
    function startQuiz() {
      if (!window.crypto || !window.crypto.randomUUID) {
        quizSection.classList.remove("hidden");
        resultSection.classList.remove("show");
        wordElement.textContent = "브라우저를 확인해 주세요.";
        optionsElement.innerHTML = "";
        feedbackElement.textContent =
          "이 브라우저에서는 crypto.randomUUID()를 사용할 수 없습니다. 최신 브라우저의 HTTPS 환경에서 실행해 주세요.";
        feedbackElement.className = "feedback show wrong";
        nextButton.classList.add("hidden");
        return;
      }

      // 매 응시마다 새 UUID를 생성합니다.
      attemptId = crypto.randomUUID();

      currentIndex = 0;
      score = 0;
      hasAnswered = false;
      saveStates = questions.map(() => "pending");

      quizSection.classList.remove("hidden");
      resultSection.classList.remove("show");

      renderQuestion();
    }

    // ==========================================
    // 6. 문제 표시
    // ==========================================
    function renderQuestion() {
      const question = questions[currentIndex];

      hasAnswered = false;
      questionStartedAt = performance.now();

      questionCounter.textContent =
        `문제 ${currentIndex + 1} / ${questions.length}`;

      scoreCounter.textContent = `현재 점수 ${score}점`;

      const progress = (currentIndex / questions.length) * 100;
      progressBar.style.width = `${progress}%`;
      progressTrack.setAttribute("aria-valuenow", String(currentIndex));

      wordElement.textContent = question.english_word;

      optionsElement.innerHTML = "";

      question.options.forEach((option, optionIndex) => {
        const button = document.createElement("button");

        button.type = "button";
        button.className = "option";
        button.textContent = option;

        button.addEventListener("click", () => {
          handleAnswer(option, button);
        });

        optionsElement.appendChild(button);
      });

      feedbackElement.textContent = "";
      feedbackElement.className = "feedback";
      saveStatusElement.textContent = "";
      nextButton.classList.add("hidden");
    }

    // ==========================================
    // 7. 답 선택: 문제당 최초 한 번만 처리
    // ==========================================
    function handleAnswer(chosenAnswer, selectedButton) {
      if (hasAnswered) return;

      // 비동기 저장 전에 잠금 처리하여 중복 응답을 방지합니다.
      hasAnswered = true;

      const question = questions[currentIndex];
      const responseTime = Math.max(
        0,
        Math.round(performance.now() - questionStartedAt)
      );

      const isCorrect = chosenAnswer === question.correct_answer;

      if (isCorrect) {
        score += 1;
      }

      // 선택 직후 모든 보기를 비활성화합니다.
      const optionButtons = optionsElement.querySelectorAll(".option");

      optionButtons.forEach((button) => {
        button.disabled = true;

        if (button.textContent === question.correct_answer) {
          button.classList.add("correct");
        }
      });

      if (!isCorrect) {
        selectedButton.classList.add("wrong");
      }

      feedbackElement.className =
        `feedback show ${isCorrect ? "correct" : "wrong"}`;

      feedbackElement.textContent = isCorrect
        ? `정답입니다! ${question.english_word} = ${question.correct_answer}`
        : `오답입니다. 정답은 '${question.correct_answer}'입니다.`;

      scoreCounter.textContent = `현재 점수 ${score}점`;
      progressBar.style.width =
        `${((currentIndex + 1) / questions.length) * 100}%`;

      progressTrack.setAttribute(
        "aria-valuenow",
        String(currentIndex + 1)
      );

      // 저장 실패 또는 미설정이어도 다음 문제로 진행할 수 있습니다.
      if (supabaseClient) {
        saveStates[currentIndex] = "pending";
        updateSaveStatus();

        // 응답마다 INSERT 한 번만 호출합니다.
        // insert().select()는 사용하지 않습니다.
        saveAnswer({
          attempt_id: attemptId,
          question_no: question.question_no,
          english_word: question.english_word,
          chosen_answer: chosenAnswer,
          is_correct: isCorrect,
          response_time_ms: responseTime
        }, currentIndex);
      } else {
        saveStates[currentIndex] = "not_configured";
        updateSaveStatus();
      }

      nextButton.textContent =
        currentIndex === questions.length - 1
          ? "결과 보기"
          : "다음 문제";

      nextButton.classList.remove("hidden");
    }

    // ==========================================
    // 8. Supabase INSERT
    // ==========================================
    async function saveAnswer(row, index) {
      try {
        const { error } = await supabaseClient
          .from("quiz_answers")
          .insert([row]);

        if (error) {
          throw error;
        }

        saveStates[index] = "success";
      } catch (error) {
        console.error("응답 저장 실패:", error);
        saveStates[index] = "error";
      }

      // 사용자가 다음 문제로 이동했어도 저장 상태를 갱신합니다.
      updateSaveStatus();
    }

    // ==========================================
    // 9. 저장 상태 표시
    // ==========================================
    function updateSaveStatus() {
      const state = saveStates[currentIndex];

      const messages = {
        pending: "응답 저장 중...",
        success: "응답 저장 완료",
        error: "저장 실패: 퀴즈는 계속 진행할 수 있습니다.",
        not_configured:
          "Supabase 설정 전입니다. 응답은 데이터베이스에 저장되지 않았습니다."
      };

      saveStatusElement.textContent = messages[state] || "";
    }

    // ==========================================
    // 10. 다음 문제 또는 최종 결과
    // ==========================================
    function showNext() {
      if (!hasAnswered) return;

      if (currentIndex < questions.length - 1) {
        currentIndex += 1;
        renderQuestion();
      } else {
        showResult();
      }
    }

    function showResult() {
      quizSection.classList.add("hidden");
      resultSection.classList.add("show");

      progressBar.style.width = "100%";
      progressTrack.setAttribute("aria-valuenow", "3");

      finalScoreElement.textContent = `${score} / 3`;

      const messages = {
        3: "완벽합니다! 모든 단어의 뜻을 정확히 알고 있네요.",
        2: "잘했어요! 틀린 단어의 뜻을 한 번 더 확인해 보세요.",
        1: "좋아요! 단어의 뜻을 복습하고 다시 도전해 보세요.",
        0: "괜찮아요! 정답을 확인하고 다시 풀어 보세요."
      };

      resultMessageElement.textContent = messages[score];
    }

    nextButton.addEventListener("click", showNext);

    retryButton.addEventListener("click", startQuiz);

    // 최초 실행
    startQuiz();
  </script>
</body>
</html>
